server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  types {
    text/html html;
    application/javascript js;
    application/wasm wasm;
    application/json json;
    application/octet-stream data;
    image/webp webp;
    font/woff2 woff2;
  }
  gzip on;
  gzip_types application/javascript application/wasm application/json;
  # The big game file changes with every build: let the browser keep it, but check.
  location = /game.data { add_header Cache-Control "public, max-age=3600, must-revalidate"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
}
