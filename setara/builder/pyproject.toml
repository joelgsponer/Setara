[project]
name = "setara-builder"
version = "0.1.0"
description = "Turns authored spreadsheets into Setara content packs"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "arabic-reshaper>=3.0",
  "python-bidi>=0.6",
  "fonttools>=4.50",
  "cairosvg>=2.7",
  "pillow>=10",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.3"]

[project.scripts]
setara-build = "setara_builder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["setara_builder"]
